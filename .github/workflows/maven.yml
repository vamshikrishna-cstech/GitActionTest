name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      Tag:
        description: 'Tag to run'
        required: false
        type: choice
        options:
          - smoketest
          - regression

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Ensure Script Permissions
      run: chmod +x .github/scripts/determine-changed-files.sh

    - name: Determine Changed Feature Files
      run: .github/scripts/determine-changed-files.sh

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Determine Tags for Manual Run
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        TAG="${{ github.event.inputs.Tag }}"
        if [ -z "$TAG" ]; then
          echo "No tag specified for manual trigger. Skipping tag-based filtering."
          echo "TAG_STRING=" >> $GITHUB_ENV
        else
          echo "Running tests with tag: $TAG"
          echo "TAG_STRING=$TAG" >> $GITHUB_ENV
        fi

    - name: Run Cucumber Tests
      run: |
        if [ -n "${{ env.FEATURE_FILES }}" ]; then
          echo "Running tests for changed feature files: ${{ env.FEATURE_FILES }}"
          mvn test -Dcucumber.options="${{ env.FEATURE_FILES }} --plugin com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        elif [ -n "${{ env.TAG_STRING }}" ]; then
          echo "Running tests with tag: ${{ env.TAG_STRING }}"
          mvn test -Dcucumber.filter.tags="${{ env.TAG_STRING }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        else
          echo "No feature files or tags specified. Skipping Cucumber tests."
        fi

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
