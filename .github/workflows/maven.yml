name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch all history
        run: git fetch --all

      - name: Detect Changed Files
        id: detect-changes
        run: |
          BASE_BRANCH="origin/main"
          PR_BRANCH="${{ github.head_ref }}"
          CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...$PR_BRANCH 2>/dev/null || echo "No common base")
          echo "Changed files: $CHANGED_FILES"
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set FEATURE_FILES
        id: set_feature_files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Filter out the changed feature files only
            CHANGED_FEATURE_FILES=$(echo "${{ env.CHANGED_FILES }}" | grep -E '^src/test/resources/features/.*\.feature$' || echo "")
            if [ -z "$CHANGED_FEATURE_FILES" ]; then
              echo "No feature files changed. Skipping tests."
              echo "FEATURE_FILES=" >> $GITHUB_ENV
            else
              echo "FEATURE_FILES=$(echo "$CHANGED_FEATURE_FILES" | tr '\n' ' ')" >> $GITHUB_ENV
            fi
          else
            echo "FEATURE_FILES=" >> $GITHUB_ENV

      - name: Set TAG_STRING
        id: set_tag_string
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
            echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG_STRING=" >> $GITHUB_ENV

      - name: Clean the project
        run: mvn clean

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Run Cucumber Tests
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "${{ env.FEATURE_FILES }}" ]; then
            echo "Running tests for changed feature files: ${{ env.FEATURE_FILES }}"
            mvn test -Dcucumber.features="${{ env.FEATURE_FILES }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ env.TAG_STRING }}" ]; then
            echo "Running tests with TAG_STRING: ${{ env.TAG_STRING }}"
            mvn test -Dcucumber.filter.tags="${{ env.TAG_STRING }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
          else
            echo "No tests to run."

      - name: List target directory files
        run: ls -R target

      - name: Upload Extent Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports
          path: target/extent-reports/*
