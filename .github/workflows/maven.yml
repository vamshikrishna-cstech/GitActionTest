name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: false
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch the full commit history to compare commits

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Detect Changed Files
      id: detect-changes
      run: |
        # Fetch all history to make sure we have full commit data
        git fetch --all
        
        # Detect changed files based on the event type
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # In a pull request, compare the PR branch with the base branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
        else
          # For push, compare the latest commit with the previous one
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
        fi
        
        echo "Changed files: $CHANGED_FILES"
        
        # Format changed files to avoid issues when exporting to the environment
        SAFE_CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
        echo "CHANGED_FILES=$SAFE_CHANGED_FILES" >> $GITHUB_ENV

    - name: Set TAG_STRING based on changed files
      id: set_tag_string
      run: |
        TAG_STRING=""
        for file in $CHANGED_FILES; do
          if grep -q '@regression' "$file"; then
            echo "Regression tag found in $file"
            TAG_STRING="@regression"
          elif grep -q '@smoketest' "$file"; then
            echo "Smoketest tag found in $file"
            TAG_STRING="@smoketest"
          fi
        done

        # If no tag is found in the changed files, default to no tests
        if [ -z "$TAG_STRING" ]; then
          echo "No relevant tags found, skipping tests."
        fi

        echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      if: env.TAG_STRING != ''
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
      continue-on-error: true

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
