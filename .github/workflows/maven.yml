name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    # Step to clean the project
    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install

    - name: Run Cucumber Tests
      run: mvn test -Dcucumber.options="src/test/resources/features --plugin pretty --plugin html:target/cucumber-reports/cucumber-reports.html --glue Stepdefinition"

    # Debug step: List files in the target directory
    - name: List target directory files
      run: ls -R target

    # Upload Surefire reports
    - name: Upload Surefire Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/*

    # Upload Cucumber reports
    - name: Upload Cucumber Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-reports
        path: target/cucumber-reports/*
