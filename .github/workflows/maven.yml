name: Run Cucumber Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      Tag:
        description: 'Tag to run'
        required: false
        type: choice
        options:
          - smoketest
          - regression

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    # Detect changed feature files
	- name: Determine Changed Feature Files
	  id: changed_files
	  run: |
	    echo "Checking for changed feature files..."
	    CHANGED_FILES=$(git diff --name-only origin/main | grep '.feature' || true)
	    echo "Changed files: $CHANGED_FILES"
	    if [ -z "$CHANGED_FILES" ]; then
	      echo "No changed feature files detected."
	      echo "run_tests=false" >> $GITHUB_ENV
	    else
	      echo "run_tests=true" >> $GITHUB_ENV
	      echo "features=$CHANGED_FILES" >> $GITHUB_ENV
	    fi
	  shell: /usr/bin/bash -e {0}
	  env:
	    JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/22.0.2-9/x64
	    JAVA_HOME_22_X64: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/22.0.2-9/x64


    # Clean the project
    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    # Execute Cucumber tests for changed feature files
    - name: Execute Test Suite
      if: env.run_tests == 'true'
      run: |
        echo "Running Cucumber tests for changed feature files: ${{ env.features }}"
        mvn test -Dcucumber.options="${{ env.features }} --plugin com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    # Debug step: List files in the target directory
    - name: List target directory files
      run: ls -R target

    # Upload Extent Reports
    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
