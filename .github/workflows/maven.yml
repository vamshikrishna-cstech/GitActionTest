name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job to determine the changed feature files
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.set_run_tests.outputs.run_tests }}
      features: ${{ steps.set_run_tests.outputs.features }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine Changed Feature Files
      id: set_run_tests
      run: |
        echo "Checking for changed feature files..."
        git fetch origin main  # Ensure the main branch is available
        CHANGED_FILES=$(git diff --name-only origin/main | grep '^src/test/resources/features/.*\.feature$' || true)
        echo "Changed files: $CHANGED_FILES"
        if [ -z "$CHANGED_FILES" ]; then
          echo "No changed feature files detected."
          echo "::set-output name=run_tests::false"
        else
          echo "::set-output name=run_tests::true"
          echo "::set-output name=features::$(echo $CHANGED_FILES | tr '\n' ',')"
        fi
      shell: /usr/bin/bash -e {0}

  # Job to build the project
  build:
    runs-on: ubuntu-latest
    needs: determine-changes  # This job runs only if the previous job succeeded
    if: needs.determine-changes.outputs.run_tests == 'true'  # Only run if there are changed feature files

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

  # Job to run tests
  run-tests:
    runs-on: ubuntu-latest
    needs: build  # This job runs only after the build job succeeds
    if: needs.determine-changes.outputs.run_tests == 'true'  # Only run if there are changes to feature files

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Debug Environment Variables
      run: |
        echo "Environment variables:"
        echo "features: ${{ needs.determine-changes.outputs.features }}"
        echo "run_tests: ${{ needs.determine-changes.outputs.run_tests }}"

    - name: Run Cucumber Tests
      run: |
        echo "Running tests for feature files:"
        echo "${{ needs.determine-changes.outputs.features }}"
        mvn test -Dfeatures="${{ needs.determine-changes.outputs.features }}"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*

    - name: Upload Failure Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs
        path: target/surefire-reports/*
