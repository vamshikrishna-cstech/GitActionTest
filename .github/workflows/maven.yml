jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Detect changes and set tags
      id: detect-changes
      run: |
        CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        echo "Changed files: $CHANGED_FILES"
        TAG_STRING=""
        if echo "$CHANGED_FILES" | grep -q 'path/to/smoke/tests'; then
          TAG_STRING="smoketest"
        elif echo "$CHANGED_FILES" | grep -q 'path/to/regression/tests'; then
          TAG_STRING="regression"
        fi
        echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      if: env.TAG_STRING != ''
      run: mvn test -Dcucumber.filter.tags="${{ env.TAG_STRING }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
