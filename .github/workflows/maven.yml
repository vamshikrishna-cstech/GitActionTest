name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ['@smoketest', '@regression']  # Define tags directly here
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clean the project
        run: mvn clean

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Set TAG_STRING based on workflow_dispatch or matrix
        id: set_tag_string
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Using manual tag input: ${{ github.event.inputs.tag }}"
            echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "Running matrix tag: ${{ matrix.tag }}"
            echo "TAG_STRING=${{ matrix.tag }}" >> $GITHUB_ENV
          fi

      - name: Run Cucumber Tests
        run: |
          echo "Running tests with TAG_STRING: $TAG_STRING"
          mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        continue-on-error: true

      - name: List target directory files
        run: ls -R target

      - name: Upload Extent Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ matrix.tag }}
          path: target/extent-reports/*
