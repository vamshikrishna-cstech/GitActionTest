name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to access all commits

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Detect Changed Files
      id: detect-changes
      run: |
        # Fetch the full repository history to ensure we can compare commits
        git fetch --all
        
        # Get the changed files between the previous commit and the current commit
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
        else
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
        fi
        
        echo "Changed files: $CHANGED_FILES"
        echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

    - name: Set TAG_STRING based on changed files
      id: set_tag_string
      run: |
        TAG_STRING=""
        for file in $CHANGED_FILES; do
          if grep -q '@regression' "$file"; then
            TAG_STRING="@regression"
          elif grep -q '@smoketest' "$file"; then
            TAG_STRING="@smoketest"
          fi
        done
        echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      if: env.TAG_STRING != ''
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
