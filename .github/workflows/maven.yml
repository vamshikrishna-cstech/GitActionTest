name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: false
        type: choice
        options:
          - '@smoketest'
          - '@regression'
          - 'none'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Set TAG_STRING based on the event type (workflow_dispatch, push, or pull request)
    - name: Set TAG_STRING
      id: set_tag_string
      run: |
        echo "Event: ${{ github.event_name }}"
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Get the tag from manual input (workflow_dispatch)
          if [ "${{ github.event.inputs.tag }}" == "none" ]; then
            echo "Running tests without tagging."
            echo "TAG_STRING=" >> $GITHUB_ENV
          else
            echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
            echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          # Run all tests if PR is created/updated
          echo "Running all tests for PR."
          echo "TAG_STRING=" >> $GITHUB_ENV
        else
          # Default tag is @regression for push
          echo "Running default tag: @regression"
          echo "TAG_STRING=@regression" >> $GITHUB_ENV
        fi

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
      continue-on-error: true

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
