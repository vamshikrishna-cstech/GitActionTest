name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      Tag:
        description: 'Tag to run'
        required: true
        type: choice
        options:
          - smoketest
          - regression

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Determine Changed Files
      id: get-changed-files
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin main
          changed_files=$(git diff --name-only HEAD $(git merge-base HEAD origin/main))
          echo "Changed files: $changed_files"
          echo "::set-output name=files::$changed_files"
        else
          echo "::set-output name=files::"
        fi

    - name: Filter Feature Files
      id: filter-feature-files
      run: |
        changed_files="${{ steps.get-changed-files.outputs.files }}"
        echo "Changed files: $changed_files"
        feature_files=$(echo "$changed_files" | grep -E '\.feature$')
        echo "Feature files: $feature_files"
        echo "::set-output name=features::$feature_files"

	- name: Determine Changed Files
		id: get-changed-files
		run: |
		   chmod +x ./.github/scripts/determine-changed-files.sh
		   ./.github/scripts/determine-changed-files.sh


    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          feature_files="${{ steps.filter-feature-files.outputs.features }}"
          if [ -z "$feature_files" ]; then
            echo "No feature files changed. Skipping Cucumber tests."
          else
            mvn test -Dcucumber.options="$feature_files --plugin com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
          fi
        else
          tag="${{ github.event.inputs.Tag }}"
          mvn test -Dcucumber.filter.tags="$tag" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        fi

      env:
        MAVEN_OPTS: "-Dorg.apache.commons.logging.Log=org.apache.commons.logging.impl.NoOpLog"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
