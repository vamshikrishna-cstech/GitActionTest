name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch all history to make sure we have full commit data
      run: git fetch --all

    - name: Detect Changed Files
      id: detect-changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_BRANCH="origin/main"
          PR_BRANCH="${{ github.head_ref }}"
          CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...$PR_BRANCH 2>/dev/null || echo "No common base")
        else
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "No previous commit")
        fi
        
        echo "Changed files: $CHANGED_FILES"
        
        SAFE_CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
        echo "CHANGED_FILES=$SAFE_CHANGED_FILES" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: detect_changes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set TAG_STRING
      id: set_tag_string
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
          echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        else
          if echo "${{ env.CHANGED_FILES }}" | grep -q 'src/test/resources/features'; then
            CHANGED_FEATURE_FILES=$(echo "${{ env.CHANGED_FILES }}" | grep 'src/test/resources/features')
            echo "Changed feature files: $CHANGED_FEATURE_FILES"
            if [ -z "$CHANGED_FEATURE_FILES" ]; then
              echo "No feature files changed. Running default tag: @regression"
              echo "TAG_STRING=@regression" >> $GITHUB_ENV
            else
              echo "TAG_STRING=${{ env.TAG_STRING }}" >> $GITHUB_ENV
            fi
          else
            echo "No feature files changed. Running default tag: @regression"
            echo "TAG_STRING=@regression" >> $GITHUB_ENV
          fi
        fi

    - name: Debug TAG_STRING
      run: echo "TAG_STRING=${{ env.TAG_STRING }}"

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        if [ -z "${{ env.TAG_STRING }}" ]; then
          echo "No feature files or tags to test. Skipping tests."
          exit 0
        fi
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.tags="${{ env.TAG_STRING }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
