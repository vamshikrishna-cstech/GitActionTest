# .github/workflows/run-tests.yml

name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch all history to ensure we have the latest data
      run: git fetch --all

    - name: Detect Changed Files
      id: detect-changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          # Get the base branch and PR branch
          BASE_BRANCH="origin/main"
          PR_BRANCH="${{ github.head_ref }}"
          
          # Check if the PR branch exists
          if git rev-parse --quiet --verify "$PR_BRANCH" >/dev/null; then
            CHANGED_FILES=$(git diff --name-only "$BASE_BRANCH...$PR_BRANCH" 2>/dev/null || echo "No common base")
          else
            echo "PR branch $PR_BRANCH does not exist."
            CHANGED_FILES="No common base"
          fi
        else
          # For push, compare the latest commit with the previous one
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "No previous commit")
        fi
        
        echo "Changed files: $CHANGED_FILES"
        
        # Format changed files to avoid issues when exporting to the environment
        SAFE_CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
        echo "CHANGED_FILES=$SAFE_CHANGED_FILES" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Install dependencies
      run: mvn install -DskipTests

  run_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set TAG_STRING
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # Manual trigger with tag input
          echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        else
          # For push or PR, determine tag based on changed files
          if echo "${{ env.CHANGED_FILES }}" | grep -q 'src/test/resources/features'; then
            TAG_STRING=$(grep -oP '@\w+' $(echo "${{ env.CHANGED_FILES }}" | grep 'src/test/resources/features') | sort | uniq | tr '\n' ' ')
            echo "Detected tags: $TAG_STRING"
            if [ -z "$TAG_STRING" ]; then
              echo "No relevant tags found. Running default tag: @regression"
              echo "TAG_STRING=@regression" >> $GITHUB_ENV
            else
              echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV
            fi
          else
            echo "No feature files changed. Running default tag: @regression"
            echo "TAG_STRING=@regression" >> $GITHUB_ENV
          fi
        fi

    - name: Run Cucumber Tests
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
