name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: false
        type: string

jobs:
  set_feature_files:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set FEATURE_FILES
      id: set_feature_files
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
          echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
          FEATURE_FILES=$(find src/test/resources/features -name '*.feature' | tr '\n' ' ')
        else
          BASE_BRANCH="main"
          PR_BRANCH="${{ github.head_ref }}"
          CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...$PR_BRANCH || echo "")
          FEATURE_FILES=$(echo "$CHANGED_FILES" | grep -E '^src/test/resources/features/.*\.feature$' || echo "")
        fi

        if [ -z "$FEATURE_FILES" ]; then
          echo "No feature files changed or selected, running all feature files."
          FEATURE_FILES=$(find src/test/resources/features -name '*.feature' | tr '\n' ' ')
        fi

        echo "FEATURE_FILES=$FEATURE_FILES" >> $GITHUB_ENV
        echo "Detected feature files: $FEATURE_FILES"

    - name: Debug FEATURE_FILES
      run: echo "FEATURE_FILES=${{ env.FEATURE_FILES }}"

  build_and_test:
    runs-on: ubuntu-latest
    needs: set_feature_files
    if: env.FEATURE_FILES != '' # Ensure FEATURE_FILES is not empty

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        echo "Running tests for FEATURE_FILES: ${{ env.FEATURE_FILES }}"
        mvn test -Dcucumber.features="${{ env.FEATURE_FILES }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
