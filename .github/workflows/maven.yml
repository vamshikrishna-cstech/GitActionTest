name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.set_run_tests.outputs.run_tests }}
      features: ${{ steps.set_run_tests.outputs.features }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine Changed Feature Files
      id: set_run_tests
      run: |
        echo "Checking for changed feature files..."
        git fetch origin main  # Ensure the main branch is available
        CHANGED_FILES=$(git diff --name-only origin/main | grep '^src/test/resources/features/.*\.feature$' || true)
        echo "Changed files: $CHANGED_FILES"
        if [ -z "$CHANGED_FILES" ]; then
          echo "No changed feature files detected."
          echo "run_tests=false" >> $GITHUB_ENV
        else
          echo "run_tests=true" >> $GITHUB_ENV
          echo "features=$(echo $CHANGED_FILES | tr '\n' ',')" >> $GITHUB_ENV
        fi
      shell: /usr/bin/bash -e {0}

  build:
    runs-on: ubuntu-latest
    needs: determine-changes
    if: env.run_tests == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

  run-tests:
    runs-on: ubuntu-latest
    needs: build
    if: env.run_tests == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Debug Environment Variables
      run: |
        echo "Environment variables:"
        echo "features: ${{ env.features }}"
        echo "run_tests: ${{ env.run_tests }}"

    - name: Run Cucumber Tests
      run: |
        echo "Running tests for feature files:"
        echo "${{ env.features }}"
        mvn test -Dfeatures="${{ env.features }}"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*

    - name: Upload Failure Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs
        path: target/surefire-reports/*
