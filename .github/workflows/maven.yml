name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: false
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set TAG_STRING
      id: set_tag_string
      run: |
        echo "Event: ${{ github.event_name }}"
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG_STRING=" >> $GITHUB_ENV
          fi
        else
          # For PR or push, determine if there are relevant changes and set TAG_STRING accordingly
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files: $CHANGED_FILES"
          
          TAG_STRING=""
          if echo "$CHANGED_FILES" | grep -q 'path/to/smoke/files'; then
            TAG_STRING="@smoketest"
          elif echo "$CHANGED_FILES" | grep -q 'path/to/regression/files'; then
            TAG_STRING="@regression"
          fi

          echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV
        fi

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Debug TAG_STRING
      run: echo "TAG_STRING=${{ env.TAG_STRING }}"

    - name: Run Cucumber Tests
      if: env.TAG_STRING != ''
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
      continue-on-error: true

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
