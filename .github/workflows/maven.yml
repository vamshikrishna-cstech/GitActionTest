name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Detect the files changed in the pull request or push event
    - name: Detect Changed Files
      id: detect-changes
      run: |
        CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
        echo "Changed files: $CHANGED_FILES"
        echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

    # Set TAG_STRING based on the modified file and its content
    - name: Set TAG_STRING from Changed Files
      id: set_tag_string
      run: |
        TAG_STRING=""
        # Only run tests for files that contain the @regression or @smoketest tag
        for file in $CHANGED_FILES; do
          if grep -q '@regression' "$file"; then
            echo "Regression tag found in $file"
            TAG_STRING="@regression"
          elif grep -q '@smoketest' "$file"; then
            echo "Smoketest tag found in $file"
            TAG_STRING="@smoketest"
          fi
        done
        echo "TAG_STRING=$TAG_STRING" >> $GITHUB_ENV

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      if: env.TAG_STRING != ''
      run: |
        echo "Running tests with TAG_STRING: $TAG_STRING"
        mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
