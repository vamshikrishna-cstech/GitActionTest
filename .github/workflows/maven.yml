name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Install dependencies
      run: mvn install

    - name: Run Cucumber Tests
      run: mvn test -Dcucumber.options="src/test/resources/features --plugin pretty --plugin html:target/cucumber-reports.html --glue Stepdefinition"

    - name: Upload Cucumber Report
      uses: actions/upload-artifact@v3
      with:
        name: cucumber-report
        path: target/cucumber-reports.html
