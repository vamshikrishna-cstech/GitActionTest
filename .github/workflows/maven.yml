name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch all history to make sure we have full commit data
      run: git fetch --all

    - name: Detect Changed Files
      id: detect-changes
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BASE_BRANCH="origin/main"
          PR_BRANCH="${{ github.head_ref }}"
          CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...$PR_BRANCH 2>/dev/null || echo "No common base")
        else
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo "No previous commit")
        fi
        
        echo "Changed files: $CHANGED_FILES"
        
        SAFE_CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
        echo "CHANGED_FILES=$SAFE_CHANGED_FILES" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: detect_changes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Make determine-tags.sh executable
      run: chmod +x ./scripts/determine-tags.sh

    - name: Run determine-tags.sh to get tags for Maven
      run: |
        echo "Running determine-tags script..."
        bash ./scripts/determine-tags.sh || { echo "Script failed"; exit 1; }
        echo "TAG_STRING=$TAG_STRING"
      shell: /usr/bin/bash -e {0}

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Running tests with TAG_STRING: ${{ github.event.inputs.tag }}"
          mvn test -Dcucumber.filter.tags="${{ github.event.inputs.tag }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        else
          if echo "${{ env.CHANGED_FILES }}" | grep -q 'src/test/resources/features'; then
            CHANGED_FEATURE_FILES=$(echo "${{ env.CHANGED_FILES }}" | grep 'src/test/resources/features')
            if [ -z "$CHANGED_FEATURE_FILES" ]; then
              echo "No feature files to test."
              exit 0
            fi
            echo "Running tests for changed feature files: $CHANGED_FEATURE_FILES"
            for FEATURE in $CHANGED_FEATURE_FILES; do
              echo "Running tests for feature: $FEATURE"
              mvn test -Dcucumber.features="$FEATURE" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
            done
          else
            echo "No feature files changed. Running default tag: @regression"
            mvn test -Dcucumber.filter.tags="@regression" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
          fi
        fi

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
