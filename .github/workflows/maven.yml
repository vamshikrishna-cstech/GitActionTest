name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch all history
      run: git fetch --all

    - name: Determine Tags or Feature Files
      id: determine-tags
      run: |
        chmod +x .github/scripts/determine-tags.sh
        .github/scripts/determine-tags.sh
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}

  build:
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set TAG_STRING
      id: set_tag_string
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
          echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        elif [ "${{ github.event_name }}" == "push" ]; then
          echo "Running all tests as it's a push event"
          echo "TAG_STRING=@regression" >> $GITHUB_ENV
        fi

    - name: Debug Environment
      run: |
        echo "Event Name: ${{ github.event_name }}"
        echo "FEATURE_FILES: ${{ env.FEATURE_FILES }}"
        echo "TAG_STRING: ${{ env.TAG_STRING }}"

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "${{ env.FEATURE_FILES }}" ]; then
          echo "Running tests for FEATURE_FILES: ${{ env.FEATURE_FILES }}"
          mvn test -Dcucumber.features="${{ env.FEATURE_FILES }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Running tests with TAG_STRING: ${{ env.TAG_STRING }}"
          mvn test -Dcucumber.filter.tags="${{ env.TAG_STRING }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        else
          echo "No tests to run."
        fi

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
