name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch all history to make sure we have full commit data
      run: git fetch --all

    - name: Detect Changed Files
      id: detect-changes
      run: |
        BASE_BRANCH="origin/main"
        PR_BRANCH="${{ github.head_ref }}"
        CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...$PR_BRANCH 2>/dev/null || echo "No common base")
        echo "Changed files: $CHANGED_FILES"
        SAFE_CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
        echo "CHANGED_FILES=$SAFE_CHANGED_FILES" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-latest
    needs: detect_changes
    if: ${{ github.event_name != 'pull_request' || env.CHANGED_FILES }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # Set TAG_STRING based on the event type (workflow_dispatch, push, or pull request)
    - name: Set TAG_STRING
      id: set_tag_string
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "Manual run with tag input: ${{ github.event.inputs.tag }}"
          echo "TAG_STRING=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        elif [ "${{ github.event_name }}" == "push" ]; then
          echo "Running all tests as it's a push event"
          echo "TAG_STRING=@regression" >> $GITHUB_ENV
        fi

    - name: Set FEATURE_FILES
      id: set_feature_files
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          CHANGED_FEATURE_FILES=$(echo "${{ env.CHANGED_FILES }}" | grep -E '^src/test/resources/features/.*\.feature$' || echo "")
          if [ -z "$CHANGED_FEATURE_FILES" ]; then
            echo "No feature files changed. Skipping tests."
            echo "FEATURE_FILES=" >> $GITHUB_ENV
          else
            echo "FEATURE_FILES=$(echo "$CHANGED_FEATURE_FILES" | tr '\n' ' ')" >> $GITHUB_ENV
          fi
        else
          echo "FEATURE_FILES=" >> $GITHUB_ENV
        fi

    - name: Debug Environment
      run: |
        echo "Event Name: ${{ github.event_name }}"
        echo "CHANGED_FILES: ${{ env.CHANGED_FILES }}"
        echo "FEATURE_FILES: ${{ env.FEATURE_FILES }}"
        echo "TAG_STRING: ${{ env.TAG_STRING }}"

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "${{ env.FEATURE_FILES }}" ]; then
          echo "Running tests for FEATURE_FILES: ${{ env.FEATURE_FILES }}"
          mvn test -Dcucumber.features="${{ env.FEATURE_FILES }}" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        else
          echo "Running tests with TAG_STRING: $TAG_STRING"
          mvn test -Dcucumber.filter.tags="$TAG_STRING" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"
        fi

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
