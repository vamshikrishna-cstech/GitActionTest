name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Clean the project
      run: mvn clean

    # Skip tests during mvn install
    - name: Install dependencies (Skip Tests)
      run: mvn install -DskipTests

    # Run tests separately with specific logging options
    - name: Run Cucumber Tests
      run: mvn test -Dcucumber.filter.tags="@smoke" -Dcucumber.plugin="com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:"

      env:
        MAVEN_OPTS: "-Dorg.apache.commons.logging.Log=org.apache.commons.logging.impl.NoOpLog"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
