name: Run Tests Based on Tags

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Debug selected tag
      run: |
        echo "Selected tag: ${{ github.event.inputs.tag }}"

    - name: List feature files for the selected tag
      id: list_files
      run: |
        echo "Listing feature files associated with the selected tag:"
        echo "Tag: ${{ github.event.inputs.tag }}"
        # Find all feature files associated with the selected tag
        FEATURE_FILES=$(grep -rl "${{ github.event.inputs.tag }}" src/test/resources/features || echo "No feature files associated with the tag.")
        echo "$FEATURE_FILES"
        # Write the list of feature files to a temporary file
        echo "$FEATURE_FILES" > feature_files.txt
        echo "FEATURE_FILES_FILE=feature_files.txt" >> $GITHUB_ENV

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        echo "Running tests for tag: ${{ github.event.inputs.tag }}"
        echo "Feature files to be executed:"
        cat ${{ env.FEATURE_FILES_FILE }}
        # Pass the list of feature files to Maven as a system property
        mvn test -Dcucumber.filter.tags="${{ github.event.inputs.tag }}" -Dfeatures.file=${{ env.FEATURE_FILES_FILE }}

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
