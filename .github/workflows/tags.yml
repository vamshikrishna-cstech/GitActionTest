name: Run Tests Based on Tags

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Cucumber Tag to run'
        required: true
        type: choice
        options:
          - '@smoketest'
          - '@regression'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 22
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'

    - name: Debug selected tag
      run: |
        echo "Selected tag: ${{ github.event.inputs.tag }}"

    - name: List Executable Jobs
      run: |
        echo "The following tests will be executed based on the selected tag:"
        echo "Tag: ${{ github.event.inputs.tag }}"
        # List feature files or scenarios associated with the selected tag
        # Modify this according to how your project is organized and how you map tags to tests
        grep -r "${{ github.event.inputs.tag }}" src/test/resources/features || echo "No feature files associated with the tag."

    - name: Clean the project
      run: mvn clean

    - name: Install dependencies
      run: mvn install -DskipTests

    - name: Run Cucumber Tests
      run: |
        echo "Running tests for tag: ${{ github.event.inputs.tag }}"
        mvn test -Dcucumber.filter.tags="${{ github.event.inputs.tag }}"

    - name: List target directory files
      run: ls -R target

    - name: Upload Extent Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports
        path: target/extent-reports/*
